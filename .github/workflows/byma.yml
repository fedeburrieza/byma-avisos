name: BYMA alertas

on:
  schedule:
    # cada 5 minutos, lunes a viernes, 09:00 a 20:59 hora Argentina (UTC-3)
    - cron: "*/5 12-23 * * 1-5"
  workflow_dispatch:   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para guardar seen.json en el repo

concurrency:
  group: byma
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Revisar BYMA y avisar por Telegram
        run: python byma_alertas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKERS: ${{ vars.TICKERS }}

      - name: Guardar estado (avisos ya vistos)
        run: |
          git config user.name "byma-bot"
          git config user.email "byma-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "actualiza estado" && git push)
